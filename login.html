<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>管理员登录</title>
  <link rel="stylesheet" href="assets/css/common.css?v=2">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body {
      display: flex;
      min-height: 100vh;
      background: #fff;
    }

    .login-left {
      flex: 1;
      background: linear-gradient(135deg, #142838 0%, #1f3a4f 50%, #2a4d68 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .login-left::before {
      content: ''; position: absolute;
      top: -100px; right: -100px;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: rgba(0,200,150,0.08);
    }
    .login-left::after {
      content: ''; position: absolute;
      bottom: -80px; left: -80px;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: rgba(245,166,35,0.08);
    }

    .login-illustration {
      width: 100%; max-width: 380px;
      height: auto; margin-bottom: 36px;
      position: relative; z-index: 1;
    }
    .brand-title {
      font-size: 36px; font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 12px;
      position: relative; z-index: 1;
    }
    .brand-sub {
      font-size: 14px;
      color: rgba(255,255,255,0.78);
      letter-spacing: 1px;
      position: relative; z-index: 1;
    }

    .login-right {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
      position: relative;
    }

    /* 登录页语言切换 */
    .login-lang-switch {
      position: absolute;
      top: 24px; right: 32px;
    }
    .login-lang-switch .icon-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      width: auto; height: auto;
      border-radius: 6px;
      font-size: var(--fs-body-sm);
      color: var(--color-text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .login-lang-switch .icon-btn:hover {
      background: #f0f3f7;
      color: var(--color-text);
    }
    .login-lang-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 150px;
      background: #fff;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 6px 0;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: all 0.2s;
      z-index: 100;
    }
    .login-lang-switch.open .login-lang-menu {
      opacity: 1; visibility: visible; transform: translateY(0);
    }
    .login-lang-menu a {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      color: var(--color-text);
      font-size: var(--fs-body);
      transition: background 0.15s;
    }
    .login-lang-menu a:hover { background: #f0f3f7; }

    .login-form {
      width: 100%; max-width: 360px;
    }
    .login-form-head { margin-bottom: 32px; }
    .login-title-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 30px; font-weight: 700;
      color: var(--color-text);
      letter-spacing: 1px;
    }
    .admin-tag-large {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      background: linear-gradient(135deg, #f5a623 0%, #d97706 100%);
      color: #fff;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 6px rgba(217,119,6,0.3);
    }
    .login-subtitle {
      font-size: var(--fs-meta);
      color: var(--color-text-secondary);
    }

    .login-field { margin-bottom: 20px; }
    .login-label {
      display: block;
      font-size: var(--fs-body-sm);
      color: var(--color-text);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .login-input-wrap { position: relative; }
    .login-input {
      width: 100%;
      padding: 12px 14px;
      font-size: var(--fs-body);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      transition: border-color 0.2s;
      font-family: inherit;
      background: #fff;
    }
    .login-input:focus { outline: none; border-color: var(--color-primary); }
    .login-input.has-toggle { padding-right: 42px; }
    .password-toggle {
      position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 30px; height: 30px;
      border: none; background: transparent;
      cursor: pointer;
      color: var(--color-text-muted);
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
    }
    .password-toggle:hover { color: var(--color-text-secondary); }

    .login-button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: var(--fs-body);
      font-weight: 600;
      color: #fff;
      background: var(--color-primary);
      border: none; border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(0,200,150,0.3);
      letter-spacing: 1px;
    }
    .login-button:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0,200,150,0.4);
    }
    .login-button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: var(--fs-meta);
      color: var(--color-text-muted);
    }

    @media (max-width: 900px) {
      .login-left { display: none; }
      .login-right { padding: 24px; }
    }
  </style>
</head>
<body>
  <div class="login-left">
    <svg class="login-illustration" viewBox="0 0 380 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#00c896"/>
          <stop offset="100%" stop-color="#008b6a"/>
        </linearGradient>
        <linearGradient id="shield-light" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
      </defs>

      <!-- 底部平台 -->
      <ellipse cx="190" cy="250" rx="140" ry="12" fill="rgba(0,0,0,0.2)"/>

      <!-- 主盾牌（安全/管理感）-->
      <g transform="translate(190, 130)">
        <path d="M 0 -80 L -65 -55 L -65 20 Q -65 65, 0 95 Q 65 65, 65 20 L 65 -55 Z"
          fill="url(#shield-grad)" stroke="#fff" stroke-width="2"/>
        <!-- 高光 -->
        <path d="M 0 -75 L -55 -50 L -55 15 Q -55 50, 0 75"
          fill="url(#shield-light)"/>
        <!-- 中央对勾 -->
        <path d="M -22 5 L -5 22 L 28 -15"
          stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <!-- 顶部装饰 -->
        <circle cx="0" cy="-50" r="4" fill="rgba(255,255,255,0.7)"/>
      </g>

      <!-- 装饰齿轮（左下）-->
      <g transform="translate(70, 200)">
        <circle cx="0" cy="0" r="22" fill="#1f3a4f" stroke="#f5a623" stroke-width="2"/>
        <circle cx="0" cy="0" r="8" fill="#f5a623"/>
        <g stroke="#f5a623" stroke-width="3" stroke-linecap="round">
          <line x1="0" y1="-22" x2="0" y2="-28"/>
          <line x1="0" y1="22" x2="0" y2="28"/>
          <line x1="-22" y1="0" x2="-28" y2="0"/>
          <line x1="22" y1="0" x2="28" y2="0"/>
          <line x1="-15" y1="-15" x2="-20" y2="-20"/>
          <line x1="15" y1="15" x2="20" y2="20"/>
          <line x1="15" y1="-15" x2="20" y2="-20"/>
          <line x1="-15" y1="15" x2="-20" y2="20"/>
        </g>
      </g>

      <!-- 装饰齿轮（右下，小）-->
      <g transform="translate(310, 215)">
        <circle cx="0" cy="0" r="15" fill="#1f3a4f" stroke="#00c896" stroke-width="2"/>
        <circle cx="0" cy="0" r="5" fill="#00c896"/>
        <g stroke="#00c896" stroke-width="2.5" stroke-linecap="round">
          <line x1="0" y1="-15" x2="0" y2="-20"/>
          <line x1="0" y1="15" x2="0" y2="20"/>
          <line x1="-15" y1="0" x2="-20" y2="0"/>
          <line x1="15" y1="0" x2="20" y2="0"/>
        </g>
      </g>

      <!-- 星光装饰 -->
      <g fill="rgba(255,255,255,0.6)">
        <circle cx="60" cy="60" r="2.5"/>
        <circle cx="320" cy="50" r="2"/>
        <circle cx="30" cy="130" r="1.5"/>
        <circle cx="355" cy="160" r="2"/>
        <circle cx="100" cy="40" r="1.5"/>
      </g>
    </svg>

    <div class="brand-title" id="brandTitle">管理后台</div>
    <div class="brand-sub" id="brandSub">代理运营管理 · 内部使用</div>
  </div>

  <div class="login-right">
    <!-- 语言切换（登录页独立放置） -->
    <div class="login-lang-switch" id="loginLang">
      <button class="icon-btn" id="loginLangTrigger">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
          <path d="M3 12h18 M12 3a14 14 0 0 1 4 9 14 14 0 0 1-4 9 14 14 0 0 1-4-9 14 14 0 0 1 4-9z" stroke="currentColor" stroke-width="1.6" fill="none"/>
        </svg>
        <span id="loginLangText">简体中文</span>
      </button>
      <div class="login-lang-menu" id="loginLangMenu">
        <a href="#" data-lang="zh"><span>🇨🇳</span> 简体中文</a>
        <a href="#" data-lang="en"><span>🇺🇸</span> English</a>
      </div>
    </div>

    <form class="login-form" id="loginForm" autocomplete="off">
      <div class="login-form-head">
        <div class="login-title-row">
          <h1 class="login-title" id="loginTitle">管理员登录</h1>
          <span class="admin-tag-large">ADMIN</span>
        </div>
        <p class="login-subtitle" id="loginSubtitle">请使用您的管理员账号登录</p>
      </div>

      <div class="login-field">
        <label class="login-label" for="account" id="lblAccount">账号</label>
        <input type="text" class="login-input" id="account" placeholder="请输入管理员账号" />
      </div>

      <div class="login-field">
        <label class="login-label" for="password" id="lblPassword">密码</label>
        <div class="login-input-wrap">
          <input type="password" class="login-input has-toggle" id="password" placeholder="请输入密码" />
          <button type="button" class="password-toggle" id="togglePwd">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-button" id="btnLogin">登 录</button>

      <div class="login-footer" id="loginFooter">
        © 2026 管理后台 · 仅供内部人员使用
      </div>
    </form>
  </div>

  <script src="assets/js/i18n.js?v=1"></script>
  <script>
    /* ============== 应用 i18n ============== */
    function applyI18n() {
      document.getElementById('brandTitle').textContent = t('login.brand');
      document.getElementById('brandSub').textContent = t('login.brandSub');
      document.getElementById('loginTitle').textContent = t('login.title');
      document.getElementById('loginSubtitle').textContent = t('login.subtitle');
      document.getElementById('lblAccount').textContent = t('login.account');
      document.getElementById('account').placeholder = t('login.accountPlaceholder');
      document.getElementById('lblPassword').textContent = t('login.password');
      document.getElementById('password').placeholder = t('login.passwordPlaceholder');
      document.getElementById('btnLogin').textContent = t('login.submit');
      document.getElementById('loginFooter').textContent = t('login.footer');
      document.getElementById('loginLangText').textContent =
        getLang() === 'zh' ? t('app.langZh') : t('app.langEn');
      document.title = t('login.title');
    }
    applyI18n();

    /* ============== 语言切换 ============== */
    const langWrap = document.getElementById('loginLang');
    const langMenu = document.getElementById('loginLangMenu');
    document.getElementById('loginLangTrigger').addEventListener('click', (e) => {
      e.stopPropagation();
      langWrap.classList.toggle('open');
    });
    document.addEventListener('click', () => langWrap.classList.remove('open'));
    langMenu.querySelectorAll('[data-lang]').forEach((a) => {
      a.addEventListener('click', (e) => {
        e.preventDefault();
        setLang(a.dataset.lang);
      });
    });

    /* ============== Toast ============== */
    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = `toast toast-${type || 'success'}`;
      el.innerHTML = `<span class="toast-ico">${type === 'danger' ? '✕' : '✓'}</span>${msg}`;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2000);
    }

    const pwdInput = document.getElementById('password');
    document.getElementById('togglePwd').addEventListener('click', () => {
      pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const account = document.getElementById('account').value.trim();
      const password = pwdInput.value;
      if (!account) return toast(t('val.accountRequired'), 'danger');
      if (!password) return toast(t('val.passwordRequired'), 'danger');
      if (password.length < 6) return toast(t('val.passwordTooShort'), 'danger');

      const btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.textContent = t('login.loggingIn');

      setTimeout(() => {
        try {
          localStorage.setItem('zb_admin_logged_in', '1');
          localStorage.setItem('zb_admin_account', account);
        } catch (err) {}
        toast(t('login.successToast'), 'success');
        setTimeout(() => window.location.href = 'invited-users.html', 500);
      }, 600);
    });
  </script>
</body>
</html>
