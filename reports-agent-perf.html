    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = `toast toast-${type || 'success'}`;
      el.innerHTML = `<span class="toast-ico">${type === 'danger' ? '✕' : '✓'}</span>${msg}`;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2000);
    }

    /* ============== 汇总：根据 type 决定指标项 ============== */
    function calcSummary(data, type) {
      const s = { regUsers:0, tradeUsers:0, lots:0, settledComm:0, settledShare:0, rebate:0, deposit:0, withdraw:0 };
      data.forEach(r => {
        s.regUsers     += r.newRegUsers;
        s.tradeUsers   += r.tradeUsers;
        s.lots         += r.lots;
        s.settledComm  += r.settledComm;
        if (type === 'ZB' && hasShare(r)) s.settledShare += r.share;
        if (type !== 'ZB')                s.rebate       += r.rebate;
        s.deposit      += r.deposit;
        s.withdraw     += r.withdraw;
      });
      return s;
    }
    function renderSummary(data, type) {
      const s = calcSummary(data, type);
      const item = (label, val) =>
        `<span class="sum-item"><span class="sum-k">${label}:</span> <b class="sum-v">${val}</b></span>`;
      const items = [
        item(t('report.summary.regUsers'),    fmtNum(s.regUsers)),
        item(t('report.summary.tradeUsers'),  fmtNum(s.tradeUsers)),
        item(t('report.summary.lots'),        s.lots.toFixed(2)),
        item(t('report.summary.settledComm'), s.settledComm.toFixed(2)),
        /* 类型专属：ZB → 已结算分成；IB/KOL → 返利总额 */
        type === 'ZB'
          ? item(t('report.summary.settledShare'), s.settledShare.toFixed(2))
          : item(t('report.summary.rebate'),       s.rebate.toFixed(2)),
        item(t('report.summary.deposit'),     s.deposit.toFixed(2)),
        item(t('report.summary.withdraw'),    s.withdraw.toFixed(2)),
        item(t('report.summary.netDeposit'), (s.deposit - s.withdraw).toFixed(2)),
      ];
      return `
        <div class="result-summary">
          <span class="sum-title">${t('report.summary.title')}</span>
          ${items.join('')}
        </div>
      `;
    }

    }
    function renderTable(data, type) {
      if (!data.length) {
        return `<div class="empty-state"><div class="empty-icon">📊</div>暂无 ${type} 代理数据</div>`;
      }
      const cols = SCHEMA_BY_TYPE[type].map(k => C[k]);
      const rows = data.map(r => `<tr>${cols.map(c => c.render(r)).join('')}</tr>`).join('');
      return `
        <div class="table-wrap">
          <table class="data-table biz-table">
            <colgroup>${cols.map(c => `<col style="width:${c.width}px">`).join('')}</colgroup>
            <thead><tr>${cols.map(renderHeader).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function pagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / 20));
      return `
        <div class="pagination">
          <span class="page-info">共 <b>${total}</b> 条 / <b>${totalPages}</b> 页</span>
          <div class="page-btns">
            <button class="page-btn">«</button>
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">›</button>
            <button class="page-btn">»</button>
          </div>
        </div>
      `;
    }

    /* ============== 渲染：单个 tab 的筛选块（独立 ID） ============== */
    function renderFilterBlock(type) {
      const tiers = tiersForType(type);
      return `
        <div class="filter-block" id="filterBlock-${type}">
          <div class="filter-row filter-row-1">
            <select class="form-select filter-input" id="fProject-${type}">
              <option value="">${t('report.filter.project')}</option>
              ${PROJECTS.map(p => `<option value="${p.key}">${p.name}</option>`).join('')}
            </select>
            <input  class="form-input filter-input"  id="fSid-${type}"   placeholder="${t('report.filter.sid')}" />
            <input  class="form-input filter-input"  id="fEmail-${type}" placeholder="${t('report.filter.agentEmail')}" />
            <select class="form-select filter-input" id="fSource-${type}">
              <option value="">${t('report.filter.source')}</option>
              ${SOURCES.map(s => `<option value="${s}">${t('agents.source.' + s)}</option>`).join('')}
            </select>
            <select class="form-select filter-input" id="fRegion-${type}">
              <option value="">${t('report.filter.regRegion')}</option>
              ${COUNTRIES.map(c => `<option value="${c}">${c} · ${t('agents.country.' + c)}</option>`).join('')}
            </select>
            <select class="form-select filter-input" id="fDept-${type}">
              <option value="">${t('report.filter.dept')}</option>
              ${DEPTS.map(d => `<option value="${d}">${t('agents.dept.' + d)}</option>`).join('')}
            </select>
            <select class="form-select filter-input" id="fPerson-${type}">
              <option value="">${t('report.filter.person')}</option>
              ${ALL_PERSONS.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
            </select>
          </div>

          <div class="filter-row filter-row-2">
            <div class="date-range">
              <div class="date-input-wrap">
                <span class="date-ico">📅</span>
                <input class="dt-input" type="date" id="fDateFrom-${type}" value="2026-05-22" />
              </div>
              <span class="dt-sep">~</span>
              <div class="date-input-wrap">
                <input class="dt-input" type="date" id="fDateTo-${type}" value="2026-05-22" />
              </div>
            </div>
            <select class="form-select filter-input" id="fTier-${type}">
              <option value="">${t('report.filter.agentTier')}</option>
              ${tiers.map(x => `<option value="${x}">${t('myAgent.tier.' + x.toLowerCase())}</option>`).join('')}
            </select>
          </div>

          <div class="filter-bottom">
            <button class="btn-export" data-act="export" data-type="${type}">
              <svg viewBox="0 0 16 16" width="14" height="14" style="vertical-align:-2px;margin-right:4px">
                <path d="M8 1v10M3 6l5 5 5-5M2 14h12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              ${t('report.btn.export')}
            </button>
            <button class="btn-toggle" data-act="toggle-filter" data-type="${type}">
              <span id="toggleLabel-${type}">${t('agents.btn.collapse')}</span>
              <svg id="toggleIco-${type}" viewBox="0 0 16 16" width="12" height="12" style="transform:rotate(180deg);transition:transform .2s">
                <path d="M3 6l5 5 5-5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <div class="filter-actions">
              <button class="btn-reset" data-act="reset"  data-type="${type}">${t('common.reset')}</button>
              <button class="btn-query" data-act="search" data-type="${type}">${t('common.search')}</button>
            </div>
          </div>
        </div>
      `;
    }

    /* ============== 渲染：单个 tab 的 pane ============== */
    function renderPane(type, active) {
      return `
        <div class="biz-pane" id="pane-${type}" data-type="${type}"${active ? '' : ' style="display:none"'}>
          ${renderFilterBlock(type)}
          <div id="summaryArea-${type}"></div>
          <div id="tableArea-${type}"></div>
          <div id="paginationArea-${type}"></div>
        </div>
      `;
    }

    /* ============== 主框架 ============== */
    const PAGE_CONTENT = `
      <div class="page-header">
        <h1 class="page-title">${t('page.reports-agent-perf.title')}</h1>
        <p class="page-desc">${t('page.reports-agent-perf.desc')}</p>
      </div>

      <div class="card sec-card">
        <!-- ===== 业务类型 Tab ===== -->
        <div class="biz-tabs" role="tablist">
          ${TYPES.map((tp, i) => `
            <button class="biz-tab ${i===0 ? 'active' : ''}" data-type="${tp}">
              ${tp} <span class="biz-tab-count" id="cnt-${tp}"></span>
            </button>
          `).join('')}
        </div>

        <!-- ===== 每个业务类型独立一个 pane（含独立筛选 + 汇总 + 表格 + 分页） ===== -->
        ${TYPES.map((tp, i) => renderPane(tp, i === 0)).join('')}
      </div>
    `;

    let currentType = 'ZB';

    /* 一次性渲染所有 3 个 tab 的汇总 + 表格 + 分页 + 条数徽标 */
    function refresh() {
      TYPES.forEach(tp => {
        const data = ROWS.filter(r => r.type === tp);
        document.getElementById('summaryArea-' + tp).innerHTML    = renderSummary(data, tp);
        document.getElementById('tableArea-' + tp).innerHTML      = renderTable(data, tp);
        document.getElementById('paginationArea-' + tp).innerHTML = pagination(data.length);
        const cntEl = document.getElementById('cnt-' + tp);
        if (cntEl) cntEl.textContent = `(${data.length})`;
      });
      setupDragScroll();
    }

    /* ============== 拖拽横向滚动（每个 .table-wrap 都挂） ============== */
    const _drag = { wrap: null, down: false, moved: false, sx: 0, sl: 0 };
    document.addEventListener('mouseup', () => {
      if (_drag.down) {
        _drag.down = false;
        _drag.wrap && _drag.wrap.classList.remove('dragging');
      }
    });
    function setupDragScroll() {
      document.querySelectorAll('.table-wrap').forEach(wrap => {
        wrap.addEventListener('mousedown', (e) => {
          if (e.target.closest('button, a, input, select, textarea')) return;
          _drag.wrap  = wrap;
          _drag.down  = true;
          _drag.moved = false;
          _drag.sx    = e.pageX - wrap.offsetLeft;
          _drag.sl    = wrap.scrollLeft;
          wrap.classList.add('dragging');
        });
        wrap.addEventListener('mousemove', (e) => {
          if (!_drag.down || _drag.wrap !== wrap) return;
          e.preventDefault();
          const x = e.pageX - wrap.offsetLeft;
          const walk = x - _drag.sx;
          if (Math.abs(walk) > 3) _drag.moved = true;
          wrap.scrollLeft = _drag.sl - walk;
        });
        wrap.addEventListener('click', (e) => {
          if (_drag.moved && _drag.wrap === wrap) {
            e.stopPropagation(); e.preventDefault();
            _drag.moved = false;
          }
        }, true);
      });
    }

    /* 部门 → 个人：仅作用于指定 type 的 pane */
    function rebuildPersonOptions(type) {
      const sel  = document.getElementById('fPerson-' + type);
      const dept = document.getElementById('fDept-' + type).value;
      const list = personsForDept(dept);
      sel.innerHTML =
        `<option value="">${t('report.filter.person')}</option>` +
        list.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
      sel.value = '';
    }

    /* ============== 展开 / 收起（每个 tab 独立持久化） ============== */
    const FILTER_STATE_KEY = 'zb_admin_report_filter_expanded';
    function setFilterExpanded(type, expanded) {
      const block = document.getElementById('filterBlock-' + type);
      if (!block) return;
      block.classList.toggle('collapsed', !expanded);
      document.getElementById('toggleLabel-' + type).textContent =
        expanded ? t('agents.btn.collapse') : t('agents.btn.expand');
      document.getElementById('toggleIco-' + type).style.transform =
        expanded ? 'rotate(180deg)' : 'rotate(0deg)';
      try { localStorage.setItem(`${FILTER_STATE_KEY}_${type}`, expanded ? '1' : '0'); } catch (e) {}
    }

    /* ============== 入口 ============== */
    /* 重置按钮要清空的字段名（不含 type 后缀；日期单独处理） */
    const FILTER_FIELDS  = ['fProject','fSid','fEmail','fSource','fRegion','fDept','fPerson','fTier'];
    const DATE_DEFAULTS  = { fDateFrom: '2026-05-22', fDateTo: '2026-05-22' };

    window.onPageReady = function () {
      refresh();

      /* 各 tab 的展开/收起初始状态（默认展开） */
      TYPES.forEach(tp => {
        const saved = (() => { try { return localStorage.getItem(`${FILTER_STATE_KEY}_${tp}`); } catch (e) { return null; } })();
        setFilterExpanded(tp, saved !== '0');
      });

      /* Tab 切换：仅切换 pane 显隐 + active 样式（数据已经渲染好） */
      document.querySelectorAll('.biz-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.type === currentType) return;
          currentType = btn.dataset.type;
          document.querySelectorAll('.biz-tab').forEach(b =>
            b.classList.toggle('active', b.dataset.type === currentType)
          );
          document.querySelectorAll('.biz-pane').forEach(p =>
            p.style.display = (p.dataset.type === currentType) ? '' : 'none'
          );
        });
      });

      /* 事件委托：toggle-filter / reset / search / export 按 data-type 作用于对应 pane */
      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const type = btn.dataset.type;
        if (!type || !TYPES.includes(type)) return;
        const act = btn.dataset.act;

        if (act === 'toggle-filter') {
          const collapsed = document.getElementById('filterBlock-' + type).classList.contains('collapsed');
          setFilterExpanded(type, collapsed);
        }
        else if (act === 'reset') {
          FILTER_FIELDS.forEach(id => {
            const el = document.getElementById(`${id}-${type}`);
            if (el) el.value = '';
          });
          Object.entries(DATE_DEFAULTS).forEach(([id, val]) => {
            const el = document.getElementById(`${id}-${type}`);
            if (el) el.value = val;
          });
          rebuildPersonOptions(type);
          toast(t('toast.reset'), 'success');
        }
        else if (act === 'search') {
          toast(t('toast.searched'), 'success');
        }
        else if (act === 'export') {
          toast(t('report.toast.exported') + `（${type}）`, 'success');
        }
      });

      /* 部门 → 个人 联动（每个 pane 独立挂监听） */
      TYPES.forEach(tp => {
        const dept = document.getElementById('fDept-' + tp);
        if (dept) dept.addEventListener('change', () => rebuildPersonOptions(tp));
      });

      /* 分页 mock 提示（事件委托） */
      document.body.addEventListener('click', (e) => {
        const b = e.target.closest('.page-btn');
        if (!b || b.classList.contains('active')) return;
        toast(t('toast.pagePlaceholder'), 'success');
      });
    };

    initLayout(PAGE_CONTENT);
  </script>

  <style>
    /* ============== 层级 / 国家 / 项目 标签 ============== */
    .tier-tag {
      display: inline-block; padding: 2px 9px; border-radius: 10px;
      font-size: var(--fs-body-sm); font-weight: var(--fw-bold); color: #fff;
    }
    .tier-l1   { background: #5bc0de; }
    .tier-l2   { background: linear-gradient(135deg, #34d399 0%, #10b981 100%); }
    .tier-l3   { background: linear-gradient(135deg, #a78bfa 0%, #8b5cf6 100%); }
    .tier-l4   { background: linear-gradient(135deg, #fb923c 0%, #f97316 100%); }
    .tier-l5   { background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%); }
    .tier-test { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
    .tier-kol-1 { background: linear-gradient(135deg, #f87171 0%, #dc2626 100%); }
    .tier-kol-2 { background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%); }
    .tier-kol-3 { background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); }

    .proj-tag {
      display: inline-block; padding: 2px 8px; border-radius: 3px;
      font-size: var(--fs-body-sm); background: #f0f9ff; color: #0369a1;
      font-weight: var(--fw-medium);
    }
    .ctr-tag {
      display: inline-block; padding: 2px 7px; border-radius: 3px;
      font-size: 11.5px; font-weight: var(--fw-medium);
      background: #f8fafc; color: #334155;
      border: 1px solid #e2e8f0;
      font-family: ui-monospace, monospace;
      white-space: nowrap;
    }

    .num    { font-family: ui-monospace, monospace; }
    .small  { font-size: var(--fs-body-sm); }
    .strong { color: var(--color-primary); font-weight: var(--fw-semibold); }
    .muted  { color: var(--color-text-muted); }
    .nowrap { white-space: nowrap; }

    /* ============== 表头帮助图标 ============== */
    .th-help {
      display: inline-flex; align-items: center; justify-content: center;
      width: 14px; height: 14px; margin-right: 3px; border-radius: 50%;
      background: #94a3b8; color: #fff;
      font-size: 10px; font-weight: var(--fw-bold);
      font-family: ui-monospace, monospace;
      cursor: help; vertical-align: middle;
    }
    .th-help:hover { background: var(--color-primary); }

    /* ============== 业务类型 Tab ============== */
    .biz-tabs {
      display: flex; gap: 2px;
      border-bottom: 1px solid var(--color-border);
      margin: 6px 0 0;
    }
    .biz-tab {
      padding: 10px 22px;
      font-size: var(--fs-body);
      color: var(--color-text-secondary);
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: -1px;
      font-family: inherit;
      font-weight: var(--fw-medium);
    }
    .biz-tab:hover { color: var(--color-primary); }
    .biz-tab.active {
      color: var(--color-primary);
      font-weight: var(--fw-bold);
      border-bottom-color: var(--color-primary);
    }
    .biz-tab-count {
      color: var(--color-text-muted);
      font-size: var(--fs-meta);
      margin-left: 4px;
      font-weight: var(--fw-normal);
    }
    .biz-tab.active .biz-tab-count { color: var(--color-primary); }

    /* ============== 双行筛选 + 展开/收起 ============== */
    .filter-block { position: relative; margin-bottom: 4px; }
    .filter-block .filter-row { margin-bottom: 10px; }
    .filter-block .filter-row + .filter-row { margin-top: 0; }
    .filter-block.collapsed .filter-row-2 { display: none; }

    .date-range {
      display: flex; align-items: center; gap: 4px;
      min-width: 280px;
    }
    .date-range .date-input-wrap { padding: 4px 10px; }
    .date-range .dt-input { width: 105px; }

    .filter-bottom {
      display: flex; align-items: center; gap: 12px;
      padding-top: 6px;
      border-top: 1px dashed var(--color-border);
      margin-top: 4px;
    }
    .btn-toggle {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 10px;
      background: transparent; border: none; cursor: pointer;
      color: var(--color-text-muted);
      font-size: var(--fs-body-sm); font-family: inherit;
      border-radius: 4px; transition: all .15s;
    }
    .btn-toggle:hover { color: var(--color-primary); background: #f0f9ff; }
    .filter-bottom .filter-actions { margin-left: auto; }

    /* 导出按钮 */
    .btn-export {
      display: inline-flex; align-items: center;
      padding: 7px 16px;
      font-size: var(--fs-body); font-family: inherit;
      color: #fff; background: var(--color-primary);
      border: none; border-radius: 6px; cursor: pointer;
      transition: background .15s;
    }
    .btn-export:hover { background: var(--color-primary-hover); }

    /* ============== 查询结果汇总 ============== */
    .result-summary {
      display: flex; flex-wrap: wrap;
      align-items: center; gap: 6px 22px;
      padding: 12px 14px;
      margin: 14px 0;
      background: #fef7f0;
      border: 1px solid #fde2c4;
      border-radius: 6px;
      font-size: var(--fs-body-sm);
      line-height: 1.6;
    }
    .sum-title {
      color: #dc2626;
      font-weight: var(--fw-bold);
      margin-right: 4px;
    }
    .sum-item { display: inline-flex; align-items: baseline; gap: 4px; }
    .sum-k { color: var(--color-text-secondary); }
    .sum-v {
      color: var(--color-text);
      font-family: ui-monospace, monospace;
      font-weight: var(--fw-bold);
    }

    /* ============== 表格横向滚动（带拖拽） ============== */
    .table-wrap {
      overflow-x: auto;
      cursor: grab;
      -webkit-overflow-scrolling: touch;
    }
    .table-wrap.dragging { cursor: grabbing; user-select: none; }
    .table-wrap.dragging * { cursor: grabbing !important; }
    .table-wrap button, .table-wrap a, .table-wrap input, .table-wrap select { cursor: pointer; }
    .table-wrap::-webkit-scrollbar { height: 10px; }
    .table-wrap::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 0 0 8px 8px; }
    .table-wrap::-webkit-scrollbar-thumb {
      background: #cbd5e1; border-radius: 5px;
      border: 2px solid #f1f5f9;
    }
    .table-wrap::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .table-wrap { scrollbar-color: #cbd5e1 #f1f5f9; scrollbar-width: thin; }
  </style>
</body>
</html>
