<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>代理列表</title>
  <link rel="stylesheet" href="assets/css/common.css?v=2">
</head>
<body data-title-key="page.agents.title">
  <div id="app"></div>
  <script src="assets/js/i18n.js?v=10"></script>
  <script src="assets/js/common.js?v=2"></script>
  <script>
    (function () { try { if (localStorage.getItem('zb_admin_logged_in') !== '1') window.location.replace('login.html'); } catch (e) {} })();

    /* ============================================================
     * 代理列表（全局）
     * - 平台所有代理；不限管理员负责范围
     * - 双行筛选 + 展开/收起；表格 14 列；操作仅「查看详情」
     * ============================================================ */

    /* ============== Toast（轻量复用） ============== */
    function toast(msg, type) {
      const el = document.createElement('div');
      el.className = `toast toast-${type || 'success'}`;
      el.innerHTML = `<span class="toast-ico">${type === 'danger' ? '✕' : '✓'}</span>${msg}`;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 250); }, 2000);
    }

    /* ============== 字典 ============== */
    /* —— 代理类型 / 层级（仅保留 ZB 业务类型） —— */
    // 注：原本支持 KOL / IB / ZB 三种类型，现按需求精简至仅 ZB
    //     若需恢复 KOL / IB，把对应 key 加回 TIERS_BY_TYPE 并把 TYPES 数组补齐即可
    const TYPES = ['ZB'];
    const TIERS_BY_TYPE = {
      ZB:  ['L1', 'L2', 'L3'],
    };
    const TIERS_ALL = (() => {
      const s = new Set();
      Object.values(TIERS_BY_TYPE).forEach(arr => arr.forEach(x => s.add(x)));
      return [...s];
    })();
    function tiersForType(type) { return type ? (TIERS_BY_TYPE[type] || []) : TIERS_ALL; }

    /* —— 项目 / 来源 / 渠道 / 国家 / 部门 / 个人 —— */
    const PROJECTS = [
      { key: 'dana',      name: 'Dana' },
      { key: 'tradewill', name: 'Tradewill' },
      { key: 'zibt',      name: 'ZIBT' },
    ];
    const SOURCES  = ['natural', 'invite', 'promo', 'internal'];
    const CHANNELS = ['web', 'app', 'h5', 'pc'];
    const COUNTRIES = ['CN','HK','TW','US','IN','VN','TH','MY','ID','BR','PH','SG','JP','NG'];
    // 国家区号（用于筛选下拉，按用户需求只展示区号）
    const DIAL_CODES = {
      CN: '+86', HK: '+852', TW: '+886', US: '+1',   IN: '+91',
      VN: '+84', TH: '+66',  MY: '+60',  ID: '+62',  BR: '+55',
      PH: '+63', SG: '+65',  JP: '+81',  NG: '+234',
    };

    /* 部门 → 该部门下的成员（mock，做联动用） */
    const DEPTS = ['sales', 'ops', 'market', 'cs', 'risk'];
    const PERSONS_BY_DEPT = {
      sales:  [ { id: 'zhangwei',  name: '张伟' },  { id: 'liuyang',  name: '刘洋' } ],
      ops:    [ { id: 'lina',      name: '李娜' },  { id: 'wangfang', name: '王芳' } ],
      market: [ { id: 'chenjie',   name: '陈杰' } ],
      cs:     [ { id: 'zhaolei',   name: '赵磊' },  { id: 'sunmei',   name: '孙梅' } ],
      risk:   [ { id: 'huangbo',   name: '黄博' } ],
    };
    const ALL_PERSONS = (() => {
      const out = [];
      DEPTS.forEach(d => PERSONS_BY_DEPT[d].forEach(p => out.push({ ...p, dept: d })));
      return out;
    })();
    function personsForDept(dept) {
      return dept ? PERSONS_BY_DEPT[dept] || [] : ALL_PERSONS;
    }

    /* ============== 格式化辅助 ============== */
    function fmtNum(v)  { return Number(v).toLocaleString('en-US'); }
    /* ZB 代理：交易总额以 USDT 计 */
    function fmtUSDT(v) {
      return Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' USDT';
    }

    /* —— 标签渲染 —— */
    function typeTag(type) {
      const map = { KOL: 'tt-kol', IB: 'tt-ib', ZB: 'tt-zb' };
      return `<span class="type-tag ${map[type]||''}">${type}</span>`;
    }
    function tierTag(tier) {
      const map = {
        L1: 'tier-l1', L2: 'tier-l2', L3: 'tier-l3', L4: 'tier-l4', L5: 'tier-l5',
        test: 'tier-test',
        senior_promoter: 'tier-kol-1', user_agent: 'tier-kol-2', business_agent: 'tier-kol-3',
      };
      return `<span class="tier-tag ${map[tier]||''}">${t('myAgent.tier.' + tier.toLowerCase())}</span>`;
    }
    function projectName(key) { const p = PROJECTS.find(x => x.key === key); return p ? p.name : key; }
    function sourceTag(s)  { return `<span class="src-tag src-${s}">${t('agents.source.' + s)}</span>`; }
    function channelTag(c) { return `<span class="ch-tag ch-${c}">${t('agents.channel.' + c)}</span>`; }
    // 表格列只显示区号（如 +62、+91），保留 cc 在 title 里以便 hover 查看完整国家
    function countryTag(cc){
      const dial = DIAL_CODES[cc] || cc;
      return `<span class="ctr-tag" title="${cc} · ${t('agents.country.' + cc)}">${dial}</span>`;
    }
    /* ============== Mock 数据（localStorage 持久化） ============== */
    // localStorage key 升版 v9 → v10：
    //   1) 精简到 10 条（L1 × 3 + L2 × 4 + L3 × 3）
    //   2) 邮箱与 invited-users.html 的 inviter 字段一一对应，跨页一致
    //   3) 新增 L3 代理 → 操作列可"设置为一级代理"
    const AGENTS_KEY = 'zb_admin_agents_v11';
    /* 仅 ZB 业务类型（IB / KOL 已移除）
     * monthCommission / pendingCommission：当月获取 / 待结算 佣金（所有代理都有）
     * monthShare      / pendingShare：     当月获得 / 待结算 分成（L1 + L2 有，L3 没有）
     *
     * 测试状态字段：
     *   - tier === 'test'                            → 已开启（active）
     *   - tier !== 'test' && 有 lastTestExpire 字段   → 已失效（expired），hover 显示过期时间
     *   - 否则                                       → 未开始（none）
     */
    const DEFAULT_AGENTS = [
      /* === L1 一级代理（3 条）：无 inviter；从 L2 / L3 链路获得分成 === */
      { id:'A100001', email:'alice@gmail.com',   inviter:'-',               type:'ZB', tier:'L1', project:'zibt', source:'natural',  channel:'app', country:'IN', regTime:'2026-03-15 14:32', userCount:1620, tradeUserCount:512, lots:18560.25, monthCommission:42.80, pendingCommission:12.50, monthShare:128.40, pendingShare:32.10, dept:'sales',  person:'zhangwei' },
      // A100002 历史上曾被开启过测试，5 月失效（演示"已失效"状态）
      { id:'A100002', email:'bob@outlook.com',   inviter:'-',               type:'ZB', tier:'L1', project:'zibt', source:'natural',  channel:'web', country:'ID', regTime:'2026-04-02 09:15', userCount:320,  tradeUserCount:88,  lots:2105.50,  monthCommission:5.60,  pendingCommission:1.80,  monthShare:22.40,  pendingShare:6.20,  dept:'sales',  person:'zhangwei', lastTestExpire:'2026-05-15' },
      { id:'A100003', email:'frank@gmail.com',   inviter:'-',               type:'ZB', tier:'L1', project:'zibt', source:'natural',  channel:'h5',  country:'IN', regTime:'2026-05-08 08:50', userCount:180,  tradeUserCount:42,  lots:980.10,   monthCommission:3.20,  pendingCommission:0.90,  monthShare:12.50,  pendingShare:3.40,  dept:'sales',  person:'liuyang' },

      /* === L2 二级代理（4 条）：inviter 是 L1；从 L3 链路获得分成 === */
      { id:'A100004', email:'amy@163.com',       inviter:'alice@gmail.com', type:'ZB', tier:'L2', project:'zibt', source:'invite',   channel:'pc',  country:'CN', regTime:'2026-01-28 10:24', userCount:2400, tradeUserCount:820, lots:32850.00, monthCommission:76.40, pendingCommission:22.30, monthShare:18.60,  pendingShare:5.20,  dept:'ops',    person:'lina' },
      { id:'A100005', email:'mary@hotmail.com',  inviter:'alice@gmail.com', type:'ZB', tier:'L2', project:'zibt', source:'invite',   channel:'app', country:'VN', regTime:'2026-02-14 12:00', userCount:780,  tradeUserCount:230, lots:8420.30,  monthCommission:18.50, pendingCommission:5.20,  monthShare:9.40,   pendingShare:2.10,  dept:'sales',  person:'zhangwei' },
      { id:'A100006', email:'sara@gmail.com',    inviter:'bob@outlook.com', type:'ZB', tier:'L2', project:'zibt', source:'promo',    channel:'web', country:'IN', regTime:'2026-04-18 16:22', userCount:920,  tradeUserCount:280, lots:9650.50,  monthCommission:24.20, pendingCommission:7.10,  monthShare:0,      pendingShare:0,     dept:'cs',     person:'zhaolei' },
      { id:'A100007', email:'cathy@qq.com',      inviter:'frank@gmail.com', type:'ZB', tier:'L2', project:'zibt', source:'invite',   channel:'web', country:'BR', regTime:'2026-03-22 13:55', userCount:1080, tradeUserCount:325, lots:14200.75, monthCommission:35.60, pendingCommission:10.40, monthShare:0,      pendingShare:0,     dept:'cs',     person:'sunmei' },

      /* === L3 三级代理（3 条）：inviter 是 L2；最底层，无 share === */
      { id:'A100008', email:'lucas@gmail.com',   inviter:'mary@hotmail.com',inviterTier:'L2',type:'ZB', tier:'L3', project:'zibt', source:'invite',   channel:'app', country:'NG', regTime:'2026-05-21 20:14', userCount:62,   tradeUserCount:8,   lots:120.00,   monthCommission:0.40,  pendingCommission:0.12,  monthShare:0,      pendingShare:0,     dept:'market', person:'chenjie' },
      { id:'A100009', email:'eva@163.com',       inviter:'sara@gmail.com',  inviterTier:'L2',type:'ZB', tier:'L3', project:'zibt', source:'invite',   channel:'h5',  country:'PH', regTime:'2026-02-08 17:42', userCount:580,  tradeUserCount:175, lots:5240.50,  monthCommission:13.20, pendingCommission:3.80,  monthShare:0,      pendingShare:0,     dept:'cs',     person:'zhaolei' },
      { id:'A100010', email:'derek@gmail.com',   inviter:'cathy@qq.com',    inviterTier:'L2',type:'ZB', tier:'L3', project:'zibt', source:'promo',    channel:'app', country:'SG', regTime:'2026-05-03 08:18', userCount:260,  tradeUserCount:72,  lots:1820.00,  monthCommission:6.20,  pendingCommission:1.80,  monthShare:0,      pendingShare:0,     dept:'market', person:'chenjie' },
    ];

    function loadAgents() {
      try {
        const d = JSON.parse(localStorage.getItem(AGENTS_KEY));
        if (Array.isArray(d) && d.length) return d;
      } catch (e) {}
      return DEFAULT_AGENTS.map(x => ({ ...x }));
    }
    function saveAgents(arr) {
      try { localStorage.setItem(AGENTS_KEY, JSON.stringify(arr)); } catch (e) {}
    }
    let AGENTS = loadAgents();
    let editingId = null;

    /* L1 + L2 都可获得分成（L1 从 L2/L3 获取；L2 从 L3 获取）；L3 最底层无 share */
    function hasShare(a) { return a.type === 'ZB' && (a.tier === 'L1' || a.tier === 'L2'); }

    /* ============== 操作列：按代理类型 + 层级渲染 ============== */
    /*  L1（或从 L1 进入测试态）→ 「开启/关闭测试」
     *  L2 / L3              → 「设置为一级代理」
     *  IB / KOL             → 无操作
     */
    function renderOps(a) {
      if (a.type !== 'ZB') return '<span class="muted">-</span>';
      const isTest = a.tier === 'test';
      // L1 / test-from-L1 → 测试开关
      if (a.tier === 'L1' || (isTest && a._prevTier === 'L1')) {
        // 测试中：暂时隐藏"关闭测试"按钮（后续再加），仅"开启测试"保留
        if (isTest) return '<span class="muted">-</span>';
        return `<button class="t-act" data-act="toggle-test">${t('agents.btn.enableTest')}</button>`;
      }
      // L2 / L3 → 不再提供行内"设置为一级代理"操作，统一走顶部"+ 添加一级代理"入口
      return '<span class="muted">-</span>';
    }

    /* ============== 列定义表（一份配置驱动多个 tab） ============== */
    /* 每列：{ width, header(i18n key), help?(i18n key), align?, render(a) } */
    /* 测试状态判定：
     *   active   → 当前 tier === 'test'
     *   expired  → tier 已恢复但有历史 lastTestExpire（曾开启过、现已结束）
     *   none     → 从未开启过测试
     */
    function testStatusOf(a) {
      if (a.tier === 'test') return 'active';
      if (a.lastTestExpire) return 'expired';
      return 'none';
    }
    function renderTestStatus(a) {
      // 测试模式仅对 L1 适用：L2 / L3 不展示状态，显示 "-"
      if (a.tier === 'L2' || a.tier === 'L3') {
        return '<td class="text-center"><span class="muted">-</span></td>';
      }
      const s = testStatusOf(a);
      if (s === 'active') {
        const tip = t('agents.testStatus.activeTip', { date: a.testExpire || '-' });
        return `<td class="text-center"><span class="ts-tag ts-active" title="${tip}">${t('agents.testStatus.active')}</span></td>`;
      }
      if (s === 'expired') {
        const tip = t('agents.testStatus.expiredTip', { date: a.lastTestExpire });
        return `<td class="text-center"><span class="ts-tag ts-expired" title="${tip}">${t('agents.testStatus.expired')}</span></td>`;
      }
      return `<td class="text-center"><span class="ts-tag ts-none">${t('agents.testStatus.none')}</span></td>`;
    }

    const C = {
      // 代理等级：测试态（tier='test'）展示其底层等级（_prevTier，通常为 L1），"测试"信息由"测试状态"列单独展示
      tier:           { width: 100, header: 'agents.col.tier',           align: 'center', render: a => {
        const displayTier = a.tier === 'test' ? (a._prevTier || 'L1') : a.tier;
        return `<td class="text-center">${tierTag(displayTier)}</td>`;
      } },
      // 测试状态：已开启 / 已失效（hover 显示过期时间）/ 未开始
      testStatus:     { width: 100, header: 'agents.col.testStatus',     align: 'center', render: renderTestStatus },
      inviter:        { width: 200, header: 'agents.col.inviter',        render: a => `<td class="nowrap" title="${a.inviter}">${a.inviter === '-' ? '<span class="muted">-</span>' : a.inviter}</td>` },
      id:             { width: 100, header: 'agents.col.id',             render: a => `<td class="num">${a.id}</td>` },
      email:          { width: 220, header: 'agents.col.email',          render: a => `<td class="nowrap" title="${a.email}">${a.email}</td>` },
      project:        { width: 90,  header: 'agents.col.project',        render: a => `<td><span class="proj-tag">${projectName(a.project)}</span></td>` },
      source:         { width: 100, header: 'agents.col.source',         render: a => `<td>${sourceTag(a.source)}</td>` },
      channel:        { width: 80,  header: 'agents.col.channel',        render: a => `<td>${channelTag(a.channel)}</td>` },
      // 地区列：现只显示 +XX 区号，宽度收窄
      country:        { width: 90,  header: 'agents.col.country',        render: a => `<td>${countryTag(a.country)}</td>` },
      regTime:        { width: 160, header: 'agents.col.regTime',        render: a => `<td class="num small nowrap">${a.regTime}</td>` },
      // 邀请用户数：容纳 5 字标题
      userCount:      { width: 110, header: 'agents.col.userCount',      align: 'right',  render: a => `<td class="num text-right">${fmtNum(a.userCount)}</td>` },
      // 有效邀请数量
      tradeUserCount: { width: 140, header: 'agents.col.tradeUserCount', align: 'right', render: a => `<td class="num text-right">${fmtNum(a.tradeUserCount)}</td>` },
      lots:              { width: 160, header: 'agents.col.lots',              align: 'right',  render: a => `<td class="num text-right">${fmtUSDT(a.lots)}</td>` },
      // 当月 → 绿色高亮（已结算到本月数据）；待结算 → 橙色（暂未结算，需关注）
      monthCommission:   { width: 140, header: 'agents.col.monthCommission',   align: 'right',  render: a => `<td class="num text-right strong">${fmtUSDT(a.monthCommission)}</td>` },
      pendingCommission: { width: 130, header: 'agents.col.pendingCommission', align: 'right',  render: a => `<td class="num text-right pending">${fmtUSDT(a.pendingCommission)}</td>` },
      monthShare:        { width: 140, header: 'agents.col.monthShare',        align: 'right',  render: a => `<td class="num text-right ${hasShare(a) ? 'strong' : ''}">${hasShare(a) ? fmtUSDT(a.monthShare) : '<span class="muted">-</span>'}</td>` },
      pendingShare:      { width: 130, header: 'agents.col.pendingShare',      align: 'right',  render: a => `<td class="num text-right ${hasShare(a) ? 'pending' : ''}">${hasShare(a) ? fmtUSDT(a.pendingShare) : '<span class="muted">-</span>'}</td>` },
      // 操作列：只剩 1 个按钮，收窄
      actions:        { width: 130, header: 'agents.col.actions',        align: 'center', render: a => `<td class="op-cell">${renderOps(a)}</td>` },
    };
    /* 各 tab 的列顺序：ZB 含 share / pendingShare；IB / KOL 不含
     * 列排布：当月X 紧贴对应的 待结算X，方便对比 */
    const SCHEMA_BY_TYPE = {
      ZB:  ['tier','testStatus','id','email','country','regTime','userCount','tradeUserCount','lots','monthCommission','pendingCommission','monthShare','pendingShare','actions'],
      IB:  ['tier','id','email','country','regTime','userCount','tradeUserCount','lots','monthCommission','pendingCommission','actions'],
      KOL: ['tier','id','email','country','regTime','userCount','tradeUserCount','lots','monthCommission','pendingCommission','actions'],
    };

    /* ============== 渲染：表格（按当前 tab 类型） ============== */
    function renderHeader(col) {
      const cls  = col.align === 'right' ? 'text-right' : col.align === 'center' ? 'text-center' : '';
      const help = col.help ? `<span class="th-help" title="${t(col.help)}">?</span>` : '';
      return `<th class="${cls}">${help}${t(col.header)}</th>`;
    }
    function renderTable(type) {
      const data = AGENTS.filter(a => a.type === type);
      if (!data.length) {
        return `<div class="empty-state"><div class="empty-icon">📋</div>${t('agents.empty')}</div>`;
      }
      const cols = SCHEMA_BY_TYPE[type].map(k => ({ ...C[k], key: k }));
      const rows = data.map(a => `<tr data-id="${a.id}">${cols.map(c => c.render(a)).join('')}</tr>`).join('');
      return `
        <div class="table-wrap">
          <table class="data-table biz-table">
            <colgroup>${cols.map(c => `<col style="width:${c.width}px">`).join('')}</colgroup>
            <thead><tr>${cols.map(renderHeader).join('')}</tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    /* ============== 渲染：分页（mock） ============== */
    function pagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / 20));
      return `
        <div class="pagination">
          <span class="page-info">共 <b>${total}</b> 条 / <b>${totalPages}</b> 页</span>
          <div class="page-btns">
            <button class="page-btn">«</button>
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">›</button>
            <button class="page-btn">»</button>
          </div>
        </div>
      `;
    }

    /* ============== 渲染：单个 tab 的筛选块（已精简至单行，按钮与条件并列） ============== */
    function renderFilterBlock(type) {
      return `
        <div class="filter-block" id="filterBlock-${type}">
          <div class="filter-row filter-row-1">
            <input  class="form-input filter-input"  id="fId-${type}"      placeholder="${t('agents.filter.id')}" />
            <input  class="form-input filter-input"  id="fEmail-${type}"   placeholder="${t('agents.filter.email')}" />
            <select class="form-select filter-input" id="fRegion-${type}">
              <option value="">${t('agents.filter.regRegion')}</option>
              ${COUNTRIES.map(c => `<option value="${c}">${DIAL_CODES[c]}</option>`).join('')}
            </select>
            <select class="form-select filter-input" id="fTier-${type}">
              <option value="">${t('agents.filter.tier')}</option>
              ${tiersForType(type).map(tier => `<option value="${tier}">${t('agents.filter.tier.' + tier.toLowerCase())}</option>`).join('')}
            </select>
            <div class="date-range">
              <span class="date-range-label">${t('invitedUser.filter.regTime')}</span>
              <div class="date-input-wrap">
                <span class="date-ico">📅</span>
                <input class="dt-input" type="date" id="fDateFrom-${type}" title="${t('invitedUser.filter.regTime')}" />
              </div>
              <span class="dt-sep">~</span>
              <div class="date-input-wrap">
                <input class="dt-input" type="date" id="fDateTo-${type}" title="${t('invitedUser.filter.regTime')}" />
              </div>
            </div>
            <!-- 重置 / 查询：与筛选条件同行（靠右对齐） -->
            <div class="filter-actions">
              <button class="btn-reset" data-act="reset"  data-type="${type}">${t('common.reset')}</button>
              <button class="btn-query" data-act="search" data-type="${type}">${t('common.search')}</button>
            </div>
          </div>

          <!-- 左下角：添加一级代理（仅 ZB tab 显示） -->
          ${type === 'ZB' ? `
            <div class="filter-extra">
              <button class="btn-add-l1" data-act="open-add-l1">
                ${t('agents.btn.addL1')}
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    /* ============== 渲染：单个 tab 的内容容器 ============== */
    function renderPane(type, active) {

    /* ============== 主框架 ============== */
    const PAGE_CONTENT = `
      <div class="page-header">

      </div>

      <div class="card sec-card">

      <!-- ===== 开启/关闭测试 确认弹窗 ===== -->
      <div class="modal" id="testModal">

                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
                <line x1="12" y1="8" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="12" cy="16" r="1.2" fill="currentColor"/>
              </svg>
              <div class="confirm-text">
                <div class="confirm-title" id="testConfirmMsg"></div>
                <!-- 自定义测试参数（仅"开启测试"时显示，"关闭测试"时隐藏） -->
                <div class="test-params" id="testParams">
                  <div class="test-params-grid">
                    <div class="form-line">
                      <label>${t('agents.test.params.rateLabel')} <span class="required">*</span></label>

                </div>

          </div>
          <div class="modal-foot">
            <button class="btn-outline" data-act="close-test">${t('common.cancel')}</button>
            <button class="btn-primary" id="btnTestConfirm">${t('common.confirm')}</button>
          </div>
        </div>
      </div>

      <!-- ===== 设置为一级代理 确认弹窗（针对 L2 / L3 代理升级） ===== -->
      <!-- ===== 添加一级代理 弹窗（合并：新增 + 升级两种场景） ===== -->
      <!-- 业务规则：
             - 输入邮箱 / 用户ID 查询
             - 用户尚不是代理         → 添加为 L1
             - 用户已是 L2 / L3 代理  → 升级为 L1，同时解除原邀请关系（返显原邀请人邮箱）
             - 用户已是 L1 / test     → 提示已是一级代理，不提供确认按钮
             - 始终可勾选「同时开启测试模式」（非必须） -->
      <div class="modal" id="addL1Modal">
        <div class="modal-mask" data-act="close-add-l1"></div>
        <div class="modal-body small-modal">
          <div class="modal-head">
            <h3>${t('agents.addL1.modal')}</h3>
            <button class="modal-close" data-act="close-add-l1">✕</button>
          </div>
          <div class="modal-content">
            <!-- 步骤 1：搜索栏 -->
            <div class="form-line">
              <label>${t('agents.addL1.field.search')} <span class="required">*</span></label>
              <div class="search-row">
                <input type="text" id="l1Search" placeholder="${t('agents.addL1.field.placeholder')}" autocomplete="off" />
                <button class="btn-primary btn-inline" id="btnL1Search">${t('agents.addL1.btn.search')}</button>
              </div>
            </div>

            <!-- 步骤 2：查询结果（默认隐藏，查到了才显示） -->
            <div class="l1-result" id="l1Result" style="display:none">
              <div class="l1-result-title" id="l1ResultTitle"></div>
              <div class="l1-result-card" id="l1ResultCard"></div>

              <!-- 升级场景：橙色警告条 —— "将解除邀请关系" -->
              <div class="l1-sever-warn" id="l1SeverWarn" style="display:none"></div>

              <!-- 同时开启测试模式（可选） —— 已是 L1 / test 时整行隐藏 -->
              <label class="checkbox-row" id="l1EnableTestRow" style="display:none">
                <input type="checkbox" id="l1EnableTest" />
                <span class="checkbox-label">${t('agents.promoteL1.enableTestLabel')}</span>
              </label>
              <!-- 勾选后显示测试参数 -->
              <div class="test-params" id="l1TestParams" style="display:none">
                <div class="test-params-grid">
                  <div class="form-line">
                    <label>${t('agents.test.params.rateLabel')} <span class="required">*</span></label>
                    <input type="number" id="l1RateInput" min="0" max="100" step="1" required />
                  </div>
                  <div class="form-line">
                    <label>${t('agents.test.params.expireLabel')} <span class="required">*</span></label>
                    <input type="date" id="l1ExpireInput" required />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn-outline" data-act="close-add-l1">${t('common.cancel')}</button>
            <!-- 确认按钮：默认隐藏，查询出可操作用户后才显示 -->
            <button class="btn-primary" id="btnL1Confirm" style="display:none">${t('common.confirm')}</button>
          </div>
        </div>
      </div>
    `;

    function openModal(id)  { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    /* ============== 添加一级代理：搜索 → 返显 → 确认 ============== */
    /* 业务规则（合并自原"设置为一级代理"）：
       - 输入邮箱 / 用户ID 查询
       - 用户尚不是代理         → 添加为 L1
       - 用户已是 L2 / L3 代理  → 升级为 L1，并解除原邀请关系（结果卡返显原邀请人邮箱 + 橙色警告）
       - 用户已是 L1 / test     → 提示已是一级代理，不允许重复
       - 任一场景都可勾选「同时开启测试模式」（非必须） */

    // 简单的邮箱判断（用于 mock 识别 kw 是邮箱还是 ID）
    const EMAIL_RE = /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/;
    // 当前查询命中的目标 —— { mode: 'add'|'promote'|'none', user?, agent? }
    let l1FoundUser = null;

    /* 打开弹窗：清空状态 */
    function openAddL1Modal() {
      l1FoundUser = null;
      document.getElementById('l1Search').value = '';
      document.getElementById('l1Result').style.display = 'none';
      document.getElementById('l1SeverWarn').style.display = 'none';
      document.getElementById('l1EnableTestRow').style.display = 'none';
      document.getElementById('l1TestParams').style.display = 'none';
      document.getElementById('l1EnableTest').checked = false;
      resetTestParams('l1RateInput', 'l1ExpireInput');
      document.getElementById('btnL1Confirm').style.display = 'none';
      openModal('addL1Modal');
      setTimeout(() => document.getElementById('l1Search').focus(), 50);
    }

    /* 渲染：现有代理信息卡（升级 / 已是 L1 场景共用） */
    function renderExistingAgentCard(a) {
      const tierName = tierTag(a.tier);
      const hasInviter = a.inviter && a.inviter !== '-';
      return `
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.col.id')}</span><span class="l1-info-value mono">${a.id}</span></div>
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.email')}</span><span class="l1-info-value">${a.email}</span></div>
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.currentTier')}</span><span class="l1-info-value">${tierName}</span></div>
        ${hasInviter ? `
          <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.currentInviter')}</span><span class="l1-info-value l1-info-warn mono">${a.inviter}</span></div>
        ` : ''}
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.regTime')}</span><span class="l1-info-value mono">${a.regTime}</span></div>
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.country')}</span><span class="l1-info-value">${DIAL_CODES[a.country]} (${a.country})</span></div>
      `;
    }

    /* 渲染：新用户信息卡（add 场景） */
    function renderNewUserCard(u) {
      return `
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.id')}</span><span class="l1-info-value mono">${u.userId}</span></div>
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.email')}</span><span class="l1-info-value">${u.email}</span></div>
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.regTime')}</span><span class="l1-info-value mono">${u.regTime}</span></div>
        <div class="l1-info-row"><span class="l1-info-label">${t('agents.addL1.user.country')}</span><span class="l1-info-value">${DIAL_CODES[u.country]} (${u.country})</span></div>
      `;
    }

    /* 搜索：根据 keyword 命中三态之一 */
    function doL1Search() {
      const kw = document.getElementById('l1Search').value.trim();
      if (!kw) return toast(t('agents.addL1.val.kwRequired'), 'danger');

      const isEmail = EMAIL_RE.test(kw);
      // 查找是否已是代理
      const existing = AGENTS.find(a =>
        (isEmail && a.email === kw) || (!isEmail && a.id === kw)
      );

      // 重置：每次新查询前清空所有展示态
      document.getElementById('l1SeverWarn').style.display = 'none';
      document.getElementById('l1EnableTestRow').style.display = 'none';
      document.getElementById('l1TestParams').style.display = 'none';
      document.getElementById('l1EnableTest').checked = false;
      resetTestParams('l1RateInput', 'l1ExpireInput');

      const resultEl   = document.getElementById('l1Result');
      const titleEl    = document.getElementById('l1ResultTitle');
      const cardEl     = document.getElementById('l1ResultCard');
      const confirmBtn = document.getElementById('btnL1Confirm');

      if (existing) {
        // 命中已有代理
        if (existing.tier === 'L1' || existing.tier === 'test') {
          // 已是 L1 / test → 提示，不允许操作
          l1FoundUser = { mode: 'none', agent: existing };
          titleEl.textContent = t('agents.addL1.alreadyL1');
          titleEl.classList.add('l1-result-title-warn');
          cardEl.innerHTML = renderExistingAgentCard(existing);
          confirmBtn.style.display = 'none';
        } else {
          // L2 / L3 → 升级模式
          l1FoundUser = { mode: 'promote', agent: existing };
          titleEl.textContent = t('agents.addL1.foundAgent');
          titleEl.classList.remove('l1-result-title-warn');
          cardEl.innerHTML = renderExistingAgentCard(existing);

          // 解除邀请关系警告（有 inviter 才显示）
          if (existing.inviter && existing.inviter !== '-') {
            const warnEl = document.getElementById('l1SeverWarn');
            warnEl.innerHTML = t('agents.addL1.severNotice', {
              tier:    t('myAgent.tier.' + existing.tier.toLowerCase()),
              inviter: existing.inviter,
            });
            warnEl.style.display = 'block';
          }

          document.getElementById('l1EnableTestRow').style.display = '';
          confirmBtn.style.display = '';
        }
      } else {
        // 未命中 → 新增模式（mock 一个用户）
        const nextNum = Math.max(...AGENTS.filter(a => a.id.startsWith('A1000')).map(a => parseInt(a.id.slice(5), 10) || 0)) + 1;
        l1FoundUser = {
          mode: 'add',
          user: {
            userId:  isEmail ? `U${100000 + nextNum}` : kw,
            email:   isEmail ? kw : `user${nextNum}@example.com`,
            country: 'CN',
            regTime: '2026-05-30 12:00:00',
          },
        };
        titleEl.textContent = t('agents.addL1.foundUser');
        titleEl.classList.remove('l1-result-title-warn');
        cardEl.innerHTML = renderNewUserCard(l1FoundUser.user);
        document.getElementById('l1EnableTestRow').style.display = '';
        confirmBtn.style.display = '';
      }
      resultEl.style.display = 'block';
    }

    /* 确认：按 mode 分支 — 升级 / 新增 */
    function confirmAddL1() {
      if (!l1FoundUser || l1FoundUser.mode === 'none') return;
      const enableTest = document.getElementById('l1EnableTest').checked;

      let params = null;
      if (enableTest) {
        params = readTestParams('l1RateInput', 'l1ExpireInput');
        if (!params) return;  // 校验失败保持弹窗打开
      }

      if (l1FoundUser.mode === 'promote') {
        /* === 升级现有 L2 / L3 代理 → L1，并解除原邀请关系 === */
        const a = l1FoundUser.agent;
        a.inviter = '-';
        delete a.inviterTier;
        if (enableTest) {
          a._prevTier  = 'L1';
          a.tier       = 'test';
          a.testRate   = params.rate;
          a.testExpire = params.expire;
        } else {
          a.tier = 'L1';
          delete a._prevTier;
          delete a.testRate;
          delete a.testExpire;
        }
        saveAgents(AGENTS); refresh();
        closeModal('addL1Modal');
        toast(t(enableTest ? 'agents.promoteL1.toast.doneWithTest' : 'agents.promoteL1.toast.done', {
          n: a.email, rate: params?.rate, expire: params?.expire,
        }), 'success');
      } else {
        /* === 新增 L1 代理 === */
        const u = l1FoundUser.user;
        const newAgent = {
          id: u.userId.replace('U1', 'A1'),
          email:    u.email,
          inviter:  '-',
          type:     'ZB',
          tier:     enableTest ? 'test' : 'L1',
          project:  'zibt',
          source:   'internal',
          channel:  'pc',
          country:  u.country,
          regTime:  u.regTime,
          userCount: 0,
          tradeUserCount: 0,
          lots: 0,
          monthCommission: 0, pendingCommission: 0,
          monthShare: 0,      pendingShare: 0,
          dept: '',
          person: '',
        };
        if (enableTest) {
          newAgent._prevTier  = 'L1';
          newAgent.testRate   = params.rate;
          newAgent.testExpire = params.expire;
        }
        AGENTS.unshift(newAgent);
        saveAgents(AGENTS); refresh();
        closeModal('addL1Modal');
        toast(t(enableTest ? 'agents.addL1.toast.addedWithTest' : 'agents.addL1.toast.added', {
          n: u.email, rate: params?.rate, expire: params?.expire,
        }), 'success');
      }
    }

    /* ============== 行内操作绑定 ============== */
    let testEditingId      = null;  // 当前要切换测试状态的代理 ID

    function bindRowActions() {
      document.querySelectorAll('.biz-table tbody tr').forEach((tr) => {
        const id = tr.dataset.id;
        tr.querySelectorAll('[data-act]').forEach((b) => {
          b.addEventListener('click', () => {
            const a = AGENTS.find(x => x.id === id);
            if (!a) return;
            const act = b.dataset.act;

            /* 开启 / 关闭测试模式：打开自定义确认弹窗（替代原生 confirm）*/
            if (act === 'toggle-test') {
              openTestConfirm(a);
              return;
            }

          });
        });
      });
    }

    /* ============== 测试参数 helpers ============== */
    // 读取并校验测试参数：返回 { rate, expire } 或 null（校验失败）
    // 业务规则：返佣比例 + 测试到期时间 均为必填
    function readTestParams(rateInputId, expireInputId) {
      const rateInput   = document.getElementById(rateInputId);
      const expireInput = document.getElementById(expireInputId);
      const rateRaw     = rateInput.value.trim();
      const expireRaw   = expireInput.value.trim();
      // 必填：返佣比例
      if (rateRaw === '') {
        toast(t('agents.test.params.rateRequired'), 'danger');
        rateInput.focus();
        return null;
      }
      // 范围校验：0-100 整数
      const rate = parseInt(rateRaw, 10);
      if (isNaN(rate) || rate < 0 || rate > 100) {
        toast(t('agents.test.params.rateInvalid'), 'danger');
        rateInput.focus();
        return null;
      }
      // 必填：测试到期时间
      if (expireRaw === '') {
        toast(t('agents.test.params.expireRequired'), 'danger');
        expireInput.focus();
        return null;
      }
      return { rate, expire: expireRaw };
    }
    // 重置测试参数输入框为空（用户每次打开弹窗必须重新输入）
    function resetTestParams(rateInputId, expireInputId) {
      document.getElementById(rateInputId).value   = '';
      document.getElementById(expireInputId).value = '';
    }

    /* ============== 测试模式 二次确认（自定义弹窗） ============== */
    function openTestConfirm(a) {
      testEditingId = a.id;
      const isTest = a.tier === 'test';
      const prev   = a._prevTier || 'L1';
      // 标题：开启 / 关闭测试
      document.getElementById('testModalTitle').textContent = isTest
        ? t('agents.btn.disableTest')
        : t('agents.btn.enableTest');
      // 主提示文案（i18n 模板已含 {n} 占位符）
      const msg = isTest
        ? t('agents.toast.confirmDisableTest', { n: a.email, tier: t('myAgent.tier.' + prev.toLowerCase()) })
        : t('agents.toast.confirmEnableTest', { n: a.email });
      document.getElementById('testConfirmMsg').textContent = msg;
      // 开启测试时显示参数区；关闭测试时隐藏
      const params = document.getElementById('testParams');
      if (isTest) {
        params.style.display = 'none';
      } else {
        params.style.display = '';
        resetTestParams('testRateInput', 'testExpireInput');
      }
      openModal('testModal');
    }

    function confirmToggleTest() {
      const a = AGENTS.find(x => x.id === testEditingId);
      if (!a) return;
      const isTest = a.tier === 'test';
      if (isTest) {
        const prev = a._prevTier || 'L1';
        // 关闭测试时：把当前 testExpire 转存为 lastTestExpire，作为"已失效"列的 hover 时间
        if (a.testExpire) a.lastTestExpire = a.testExpire;
        a.tier = prev;
        delete a._prevTier;
        delete a.testRate;
        delete a.testExpire;
        saveAgents(AGENTS); refresh();
        closeModal('testModal');
        toast(t('agents.toast.testDisabled', { n: a.email, tier: t('myAgent.tier.' + prev.toLowerCase()) }), 'success');
      } else {
        const params = readTestParams('testRateInput', 'testExpireInput');
        if (!params) return;  // 校验失败保持弹窗打开
        a._prevTier  = a.tier;
        a.tier       = 'test';
        a.testRate   = params.rate;
        a.testExpire = params.expire;
        // 重新开启测试 → 清除"已失效"标记
        delete a.lastTestExpire;
        saveAgents(AGENTS); refresh();
        closeModal('testModal');
        toast(t('agents.toast.testEnabledWithParams', {
          n: a.email, rate: params.rate, expire: params.expire,
        }), 'success');
      }
    }

    /* 当前激活的业务类型 tab */
    let currentType = 'ZB';

    /* 每次数据变化（开启测试 / 改绑管理员）：刷新所有 3 个 tab 的表格 + 分页 + 条数 */
    function refresh() {
      TYPES.forEach(tp => {
        const data = AGENTS.filter(a => a.type === tp);
        document.getElementById('tableArea-' + tp).innerHTML      = renderTable(tp);
        document.getElementById('paginationArea-' + tp).innerHTML = pagination(data.length);
        const cntEl = document.getElementById('cnt-' + tp);
        if (cntEl) cntEl.textContent = `(${data.length})`;
      });
      bindRowActions();
      setupDragScroll();
    }

    /* ============== 表格鼠标拖拽横向滚动 ============== */
    /* 文档级 mouseup 只绑一次；mousedown/move/click 给所有 .table-wrap 都挂上 */
    const _drag = { wrap: null, down: false, moved: false, sx: 0, sl: 0 };
    document.addEventListener('mouseup', () => {
      if (_drag.down) {
        _drag.down = false;
        _drag.wrap && _drag.wrap.classList.remove('dragging');
      }
    });
    function setupDragScroll() {
      document.querySelectorAll('.table-wrap').forEach(wrap => {
        wrap.addEventListener('mousedown', (e) => {
          if (e.target.closest('button, a, input, select, textarea')) return;
          _drag.wrap  = wrap;
          _drag.down  = true;
          _drag.moved = false;
          _drag.sx    = e.pageX - wrap.offsetLeft;
          _drag.sl    = wrap.scrollLeft;
          wrap.classList.add('dragging');
        });
        wrap.addEventListener('mousemove', (e) => {
          if (!_drag.down || _drag.wrap !== wrap) return;
          e.preventDefault();
          const x = e.pageX - wrap.offsetLeft;
          const walk = x - _drag.sx;
          if (Math.abs(walk) > 3) _drag.moved = true;
          wrap.scrollLeft = _drag.sl - walk;
        });
        wrap.addEventListener('click', (e) => {
          if (_drag.moved && _drag.wrap === wrap) {
            e.stopPropagation(); e.preventDefault();
            _drag.moved = false;
          }
        }, true);
      });
    }

    // 注：原"部门 → 业务员"联动 + "展开/收起" 折叠状态相关代码已删除
    //     —— 筛选条已精简至单行（无需折叠）；部门/业务员/级别 等筛选已下线

    /* ============== 入口 ============== */
    /* 重置按钮要清空的字段名（不含 type 后缀，精简后只剩 5 项） */
    const FILTER_FIELDS = ['fId','fEmail','fRegion','fTier','fDateFrom','fDateTo'];

    window.onPageReady = function () {
      refresh();

      /* Tab 切换：仅切换 pane 显隐 + active 样式（不动数据，每个 pane 状态自然保留） */
      document.querySelectorAll('.biz-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.type === currentType) return;
          currentType = btn.dataset.type;
          document.querySelectorAll('.biz-tab').forEach(b =>
            b.classList.toggle('active', b.dataset.type === currentType)
          );
          document.querySelectorAll('.biz-pane').forEach(p =>
            p.style.display = (p.dataset.type === currentType) ? '' : 'none'
          );
        });
      });

      /* 事件委托：reset / search 按 data-type 作用于对应 pane */
      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act]');
        if (!btn) return;
        const type = btn.dataset.type;
        if (!type || !TYPES.includes(type)) return;
        const act = btn.dataset.act;

        if (act === 'reset') {
          FILTER_FIELDS.forEach(id => {
            const el = document.getElementById(`${id}-${type}`);
            if (el) el.value = '';
          });
          toast(t('toast.reset'), 'success');
        }
        else if (act === 'search') {
          toast(t('toast.searched'), 'success');
        }
      });

      /* 分页 mock 提示（事件委托，refresh 后无需重绑） */
      document.body.addEventListener('click', (e) => {
        const b = e.target.closest('.page-btn');
        if (!b || b.classList.contains('active')) return;
        toast(t('toast.pagePlaceholder'), 'success');
      });

      /* === 测试模式 二次确认弹窗：关闭 + 确认 === */
      document.querySelectorAll('[data-act="close-test"]').forEach((el) => {
        el.addEventListener('click', () => closeModal('testModal'));
      });
      document.getElementById('btnTestConfirm').addEventListener('click', confirmToggleTest);

      /* === 添加一级代理（合并版：支持新增 + 升级两种场景） === */
      // 事件委托：open-add-l1 按钮在 renderFilterBlock 里动态生成
      document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-act="open-add-l1"]');
        if (btn) openAddL1Modal();
      });
      /* 关闭弹窗 */
      document.querySelectorAll('[data-act="close-add-l1"]').forEach((el) => {
        el.addEventListener('click', () => closeModal('addL1Modal'));
      });
      /* 搜索按钮 + 回车提交 */
      document.getElementById('btnL1Search').addEventListener('click', doL1Search);
      document.getElementById('l1Search').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doL1Search(); }
      });
      /* 测试模式复选框联动：勾选 → 展开参数区；取消勾选 → 收起并清空 */
      document.getElementById('l1EnableTest').addEventListener('change', (e) => {
        const params = document.getElementById('l1TestParams');
        if (e.target.checked) {
          params.style.display = '';
          resetTestParams('l1RateInput', 'l1ExpireInput');
        } else {
          params.style.display = 'none';
        }
      });
      /* 确认（按 mode 分支：升级 / 新增） */
      document.getElementById('btnL1Confirm').addEventListener('click', confirmAddL1);
    };

    initLayout(PAGE_CONTENT);
  </script>
