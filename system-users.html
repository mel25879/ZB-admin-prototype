<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>系统用户</title>
  <link rel="stylesheet" href="assets/css/common.css?v=2">
</head>
<body data-title-key="page.system-users.title">
  <div id="app"></div>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/common.js?v=2"></script>
  <script>
    /* ============== 登录守卫 ============== */
    (function guardLogin() {
      try {
        if (localStorage.getItem('zb_admin_logged_in') !== '1') {
          window.location.replace('login.html');
        }
      } catch (e) {}
    })();

    /* ============== Toast / 工具 ============== */
    function toast(msg, type) {
      const t = document.createElement('div');
      t.className = `toast toast-${type || 'success'}`;
      t.innerHTML = `<span class="toast-ico">${type === 'danger' ? '✕' : '✓'}</span>${msg}`;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2000);
    }

    /* ============== Mock 数据 ============== */
    // 角色用 key，渲染时翻译
    const ROLE_KEYS = ['role.admin', 'role.ops', 'role.cs', 'role.risk', 'role.fin'];
    const SYS_USERS_KEY = 'zb_admin_sys_users_v1';

    const DEFAULT_USERS = [
      { id: 1, username: 'admin',    realname: '张三', email: 'admin@zb.com',     phone: '13812345678', roleKey: 'role.admin', status: 1, lastLogin: '2026-05-23 14:23:18' },
      { id: 2, username: 'ops001',   realname: '李四', email: 'liyao@zb.com',     phone: '13900001111', roleKey: 'role.ops',   status: 1, lastLogin: '2026-05-23 09:12:05' },
      { id: 3, username: 'cs001',    realname: '王五', email: 'wangwu@zb.com',    phone: '15822223333', roleKey: 'role.cs',    status: 1, lastLogin: '2026-05-22 22:48:30' },
      { id: 4, username: 'risk001',  realname: '赵六', email: 'zhao6@zb.com',     phone: '13644445555', roleKey: 'role.risk',  status: 1, lastLogin: '2026-05-22 11:30:42' },
      { id: 5, username: 'fin001',   realname: '钱七', email: 'qian7@zb.com',     phone: '17066667777', roleKey: 'role.fin',   status: 0, lastLogin: '2026-05-20 16:05:11' },
      { id: 6, username: 'ops002',   realname: '孙八', email: 'sun8@zb.com',      phone: '13388889999', roleKey: 'role.ops',   status: 1, lastLogin: '2026-05-19 08:14:55' },
    ];

    function loadUsers() {
      try {
        const d = JSON.parse(localStorage.getItem(SYS_USERS_KEY));
        if (Array.isArray(d) && d.length) return d;
      } catch (e) {}
      return DEFAULT_USERS.slice();
    }
    function saveUsers(arr) {
      try { localStorage.setItem(SYS_USERS_KEY, JSON.stringify(arr)); } catch (e) {}
    }
    let USERS = loadUsers();
    let editingId = null;

    /* ============== 渲染 ============== */
    function renderTable() {
      return `
        <div class="table-wrap">
          <table class="data-table biz-table">
            <colgroup>
              <col style="width:12%">
              <col style="width:10%">
              <col style="width:18%">
              <col style="width:14%">
              <col style="width:12%">
              <col style="width:9%">
              <col style="width:13%">
              <col style="width:12%">
            </colgroup>
            <thead>
              <tr>
                <th>${t('sysUser.col.username')}</th>
                <th>${t('sysUser.col.realname')}</th>
                <th>${t('sysUser.col.email')}</th>
                <th>${t('sysUser.col.phone')}</th>
                <th>${t('sysUser.col.role')}</th>
                <th class="text-center">${t('sysUser.col.status')}</th>
                <th>${t('sysUser.col.lastLogin')}</th>
                <th class="text-center">${t('sysUser.col.actions')}</th>
              </tr>
            </thead>
            <tbody>
              ${USERS.length ? USERS.map((u) => `
                <tr data-id="${u.id}">
                  <td class="mono"><b>${u.username}</b></td>
                  <td>${u.realname}</td>
                  <td><span class="link-text">${u.email}</span></td>
                  <td class="muted">${u.phone}</td>
                  <td>${roleBadge(u.roleKey)}</td>
                  <td class="text-center">
                    <span class="st-tag ${u.status ? 'st-active' : 'st-disabled'}">
                      ${u.status ? t('common.statusEnabled') : t('common.statusDisabled')}
                    </span>
                  </td>
                  <td class="muted">${u.lastLogin}</td>
                  <td class="text-center">
                    <button class="t-act" data-act="edit" data-id="${u.id}">${t('common.edit')}</button>
                    <button class="t-act" data-act="reset" data-id="${u.id}">${t('sysUser.btnResetPwd')}</button>
                    <button class="t-act" data-act="toggle" data-id="${u.id}">${u.status ? t('common.disable') : t('common.enable')}</button>
                    <button class="t-act t-del" data-act="del" data-id="${u.id}">${t('common.delete')}</button>
                  </td>
                </tr>
              `).join('') : emptyRow(8)}
            </tbody>
          </table>
        </div>
      `;
    }

    function roleBadge(roleKey) {
      const map = {
        'role.admin': 'role-admin',
        'role.ops':   'role-ops',
        'role.cs':    'role-cs',
        'role.risk':  'role-risk',
        'role.fin':   'role-fin',
      };
      return `<span class="role-tag ${map[roleKey] || ''}">${t(roleKey)}</span>`;
    }

    function emptyRow(cols) {
      return `
        <tr class="empty-row">
          <td colspan="${cols}">
            <div class="empty-cell">
              <svg viewBox="0 0 64 64" width="48" height="48" class="empty-svg">
                <rect x="8" y="14" width="48" height="38" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
                <line x1="8" y1="24" x2="56" y2="24" stroke="#cbd5e1" stroke-width="1.5"/>
                <circle cx="14" cy="19" r="1.4" fill="#cbd5e1"/>
                <circle cx="18" cy="19" r="1.4" fill="#cbd5e1"/>
                <circle cx="22" cy="19" r="1.4" fill="#cbd5e1"/>
              </svg>
              <span>${t('sysUser.empty')}</span>
            </div>
          </td>
        </tr>
      `;
    }

    function pagination(total) {
      const totalPages = Math.max(1, Math.ceil(total / 20));
      return `
        <div class="pagination">
          <span class="page-info">共 <b>${total}</b> 条 / <b>${totalPages}</b> 页</span>
          <div class="page-size">
            <select class="form-select page-size-sel">
              <option>10 条/页</option><option selected>20 条/页</option>
              <option>50 条/页</option><option>100 条/页</option>
            </select>
          </div>
          <div class="page-btns">
            <button class="page-btn">«</button>
            <button class="page-btn">‹</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">›</button>
            <button class="page-btn">»</button>
          </div>
        </div>
      `;
    }

    /* ============== 主框架 ============== */
    const PAGE_CONTENT = `
      <div class="page-header">
        <h1 class="page-title">${t('page.system-users.title')}</h1>
        <p class="page-desc">${t('page.system-users.desc')}</p>
      </div>

      <div class="card sec-card">
        <!-- 筛选 + 新增 -->
        <div class="filter-row">
          <input type="text" class="form-input filter-input" placeholder="${t('sysUser.filterKw')}" id="kw" />
          <select class="form-select filter-input" id="filterRole">
            <option value="">${t('sysUser.filterRole')}</option>
            ${ROLE_KEYS.map(k => `<option value="${k}">${t(k)}</option>`).join('')}
          </select>
          <select class="form-select filter-input" id="filterStatus">
            <option value="">${t('sysUser.filterStatus')}</option>
            <option value="1">${t('common.statusEnabled')}</option>
            <option value="0">${t('common.statusDisabled')}</option>
          </select>

          <div class="filter-actions">
            <button class="btn-reset" data-act="reset">${t('common.reset')}</button>
            <button class="btn-query" data-act="search">${t('common.search')}</button>
            <button class="btn-add" id="btnAdd">
              <svg viewBox="0 0 24 24" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
              ${t('sysUser.btnAdd')}
            </button>
          </div>
        </div>

        <div id="tableArea"></div>
        ${pagination(USERS.length)}
      </div>

      <!-- 新增 / 编辑 用户弹窗 -->
      <div class="modal" id="userModal">
        <div class="modal-mask" data-act="close-user"></div>
        <div class="modal-body user-modal">
          <div class="modal-head">
            <h3 id="modalTitle">${t('sysUser.modal.add')}</h3>
            <button class="modal-close" data-act="close-user">✕</button>
          </div>
          <div class="modal-content">
            <div class="form-grid">
              <div class="form-line">
                <label>${t('sysUser.field.usernameLabel')} <span class="required">*</span></label>
                <input type="text" id="fUsername" placeholder="${t('sysUser.field.usernamePlaceholder')}" maxlength="20" />
              </div>
              <div class="form-line">
                <label>${t('sysUser.field.realnameLabel')} <span class="required">*</span></label>
                <input type="text" id="fRealname" placeholder="${t('sysUser.field.realnamePlaceholder')}" maxlength="20" />
              </div>
              <div class="form-line">
                <label>${t('sysUser.field.emailLabel')} <span class="required">*</span></label>
                <input type="email" id="fEmail" placeholder="${t('sysUser.field.emailPlaceholder')}" maxlength="50" />
              </div>
              <div class="form-line">
                <label>${t('sysUser.field.phoneLabel')}</label>
                <input type="tel" id="fPhone" placeholder="${t('sysUser.field.phonePlaceholder')}" maxlength="11" />
              </div>
              <div class="form-line">
                <label>${t('sysUser.field.roleLabel')} <span class="required">*</span></label>
                <select id="fRole">
                  <option value="">${t('sysUser.field.rolePlaceholder')}</option>
                  ${ROLE_KEYS.map(k => `<option value="${k}">${t(k)}</option>`).join('')}
                </select>
              </div>
              <div class="form-line">
                <label>${t('sysUser.field.statusLabel')}</label>
                <select id="fStatus">
                  <option value="1" selected>${t('common.statusEnabled')}</option>
                  <option value="0">${t('common.statusDisabled')}</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn-outline" data-act="close-user">${t('common.cancel')}</button>
            <button class="btn-primary" id="btnSaveUser">${t('common.save')}</button>
          </div>
        </div>
      </div>
    `;

    /* ============== 弹窗工具 ============== */
    function openModal(id) { document.getElementById(id).classList.add('show'); }
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    function openUserModal(user) {
      editingId = user ? user.id : null;
      document.getElementById('modalTitle').textContent = user ? t('sysUser.modal.edit') : t('sysUser.modal.add');
      document.getElementById('fUsername').value = user ? user.username : '';
      document.getElementById('fRealname').value = user ? user.realname : '';
      document.getElementById('fEmail').value    = user ? user.email : '';
      document.getElementById('fPhone').value    = user ? user.phone : '';
      document.getElementById('fRole').value     = user ? user.roleKey : '';
      document.getElementById('fStatus').value   = user ? String(user.status) : '1';
      // 编辑模式下用户名不能改
      document.getElementById('fUsername').disabled = !!user;
      openModal('userModal');
    }

    function refresh() {
      document.getElementById('tableArea').innerHTML = renderTable();
      bindRowActions();
    }

    function bindRowActions() {
      document.querySelectorAll('[data-act][data-id]').forEach((b) => {
        b.addEventListener('click', () => {
          const id = parseInt(b.dataset.id, 10);
          const act = b.dataset.act;
          const u = USERS.find((x) => x.id === id);
          if (!u) return;

          if (act === 'edit') openUserModal(u);
          else if (act === 'reset') {
            if (confirm(t('toast.confirmResetPwd', {n: u.username}))) {
              toast(t('toast.pwdReset', {email: u.email}), 'success');
            }
          }
          else if (act === 'toggle') {
            u.status = u.status ? 0 : 1;
            saveUsers(USERS); refresh();
            toast(u.status ? t('toast.enabled', {n: u.username}) : t('toast.disabled', {n: u.username}), 'success');
          }
          else if (act === 'del') {
            if (u.roleKey === 'role.admin') return toast(t('toast.cannotDeleteAdmin'), 'danger');
            if (confirm(t('toast.confirmDelete', {n: u.username}))) {
              USERS = USERS.filter((x) => x.id !== id);
              saveUsers(USERS); refresh();
              toast(t('toast.deleted'), 'success');
            }
          }
        });
      });
    }

    window.onPageReady = function () {
      refresh();

      // 筛选
      document.querySelectorAll('.filter-row [data-act]').forEach((b) => {
        b.addEventListener('click', () => {
          const act = b.dataset.act;
          if (act === 'reset') {
            document.getElementById('kw').value = '';
            document.getElementById('filterRole').value = '';
            document.getElementById('filterStatus').value = '';
            toast(t('toast.reset'), 'success');
          } else if (act === 'search') {
            toast(t('toast.searched'), 'success');
          }
        });
      });

      // 新增
      document.getElementById('btnAdd').addEventListener('click', () => openUserModal(null));

      // 弹窗关闭
      document.querySelectorAll('[data-act="close-user"]').forEach((el) => {
        el.addEventListener('click', () => closeModal('userModal'));
      });

      // 手机号只允许数字
      document.getElementById('fPhone').addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
      });

      // 保存
      document.getElementById('btnSaveUser').addEventListener('click', () => {
        const username = document.getElementById('fUsername').value.trim();
        const realname = document.getElementById('fRealname').value.trim();
        const email    = document.getElementById('fEmail').value.trim();
        const phone    = document.getElementById('fPhone').value.trim();
        const roleKey  = document.getElementById('fRole').value;
        const status   = parseInt(document.getElementById('fStatus').value, 10);

        if (!username) return toast(t('val.usernameRequired'), 'danger');
        if (!/^[a-zA-Z0-9_]{4,20}$/.test(username)) return toast(t('val.usernameFormat'), 'danger');
        if (!realname) return toast(t('val.realnameRequired'), 'danger');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast(t('val.emailInvalid'), 'danger');
        if (phone && !/^1[3-9]\d{9}$/.test(phone)) return toast(t('val.phoneInvalid'), 'danger');
        if (!roleKey) return toast(t('val.roleRequired'), 'danger');

        if (editingId) {
          const u = USERS.find((x) => x.id === editingId);
          Object.assign(u, { realname, email, phone, roleKey, status });
          toast(t('toast.saved'), 'success');
        } else {
          if (USERS.some((x) => x.username === username)) {
            return toast(t('val.usernameExists', {n: username}), 'danger');
          }
          USERS.unshift({
            id: Date.now(),
            username, realname, email, phone, roleKey, status,
            lastLogin: '-',
          });
          toast(t('toast.created'), 'success');
        }
        saveUsers(USERS);
        closeModal('userModal');
        refresh();
      });

      // 分页（占位）
      document.querySelectorAll('.page-btn').forEach((b) => {
        b.addEventListener('click', () => {
          if (b.classList.contains('active')) return;
          toast(t('toast.pagePlaceholder'), 'success');
        });
      });
    };

    initLayout(PAGE_CONTENT);
  </script>

  <style>
    /* —— 角色徽章 5 色 —— */
    .role-tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: var(--fs-body-sm);
      font-weight: var(--fw-semibold);
    }
    .role-admin { background: #fff5e6; color: #d97706; }
    .role-ops   { background: #e0f2fe; color: #0369a1; }
    .role-cs    { background: #dcfce7; color: #15803d; }
    .role-risk  { background: #fee2e2; color: #b91c1c; }
    .role-fin   { background: #ede9fe; color: #6d28d9; }

    /* —— 新增按钮 —— */
    .btn-add {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; font-size: var(--fs-body);
      border-radius: 5px; border: none;
      color: #fff; background: var(--color-primary);
      cursor: pointer; transition: all 0.15s;
      font-family: inherit;
      box-shadow: 0 2px 6px rgba(0,200,150,0.25);
    }
    .btn-add:hover { background: var(--color-primary-hover); transform: translateY(-1px); }

    /* —— 弹窗 —— */
    .modal { position: fixed; inset: 0; z-index: 999; display: none; }
    .modal.show { display: flex; align-items: center; justify-content: center; }
    .modal-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
    }
    .modal-body {
      position: relative; z-index: 1;
      background: #fff; border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
      animation: modalIn 0.2s;
      overflow: hidden;
    }
    .user-modal { width: 560px; max-width: 92vw; }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #f0f3f7;
    }
    .modal-head h3 {
      font-size: var(--fs-h2); font-weight: var(--fw-bold);
      color: var(--color-text);
    }
    .modal-close {
      width: 26px; height: 26px;
      border: none; background: transparent;
      cursor: pointer; border-radius: 4px;
      color: var(--color-text-muted); font-size: 16px;
    }
    .modal-close:hover { background: #f0f3f7; color: var(--color-text); }
    .modal-content { padding: 18px 20px; }
    .modal-foot {
      padding: 12px 20px;
      display: flex; justify-content: flex-end; gap: 8px;
      border-top: 1px solid #f0f3f7;
      background: #fafbfc;
    }
    .modal-foot .btn-outline, .modal-foot .btn-primary {
      padding: 7px 18px; font-size: var(--fs-body);
      border-radius: 6px; cursor: pointer; transition: all 0.15s;
      font-family: inherit; font-weight: var(--fw-medium);
      border: 1px solid transparent;
    }
    .modal-foot .btn-outline {
      color: var(--color-text); background: #fff;
      border-color: var(--color-border);
    }
    .modal-foot .btn-outline:hover { color: var(--color-primary); border-color: var(--color-primary); }
    .modal-foot .btn-primary { color: #fff; background: var(--color-primary); }
    .modal-foot .btn-primary:hover { background: var(--color-primary-hover); }

    /* —— 表单网格（2 列）—— */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }
    .form-line { display: flex; flex-direction: column; gap: 5px; }
    .form-line label {
      font-size: var(--fs-body-sm); color: var(--color-text);
      font-weight: var(--fw-medium);
    }
    .required { color: var(--color-danger); margin-left: 2px; }
    .form-line input, .form-line select {
      padding: 9px 12px;
      font-size: var(--fs-body);
      border: 1px solid var(--color-border);
      border-radius: 6px;
      transition: border-color 0.15s;
      font-family: inherit;
      background: #fff;
    }
    .form-line input:focus, .form-line select:focus {
      outline: none; border-color: var(--color-primary);
    }
    .form-line input:disabled {
      background: #fafbfc; color: var(--color-text-muted); cursor: not-allowed;
    }
  </style>
</body>
</html>
